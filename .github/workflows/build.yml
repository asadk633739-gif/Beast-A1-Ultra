name: Beast-Final-Success
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build with Clean
        # 'clean' dalne se purane failed builds ka asar khatam ho jayega
        run: ./gradlew clean jar --no-daemon
      - name: Upload Mod
        uses: actions/upload-artifact@v4
        with:
          name: Beast-A1-Final-Mod
          path: build/libs/*.jar
