plugins {
    id 'java'
}

group = 'com.beast'
version = '1.0.0'

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
}

dependencies {
    compileOnly "net.fabricmc:fabric-loader:0.15.3"
}

jar {
    manifest {
        attributes(
            'Fabric-Loom-Version': '1.4-SNAPSHOT',
            'Main-Class': 'com.beast.BeastA1Core'
        )
    }
}
