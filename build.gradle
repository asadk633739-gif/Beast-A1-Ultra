plugins {
    id 'java'
}

repositories {
    mavenCentral()
    maven { url 'https://libraries.minecraft.net/' }
    maven { url 'https://maven.fabricmc.net/' }
}

dependencies {
    compileOnly "net.fabricmc:fabric-loader:0.15.3"
    // Direct link to Minecraft Client for Holy Renderer support
    compileOnly "com.mojang:minecraft:1.20.1"
}

jar {
    manifest {
        attributes('Main-Class': 'com.beast.BeastA1Core')
    }
}
