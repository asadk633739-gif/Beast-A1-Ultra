plugins {
    id 'java'
}

group = 'com.beast'
version = '1.0.0-PRO'

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
}

dependencies {
    // Adding more direct support
    compileOnly "net.fabricmc:fabric-loader:0.15.3"
    compileOnly "net.minecraft:minecraft:1.20.1"
}

jar {
    from sourceSets.main.output
    // Isse mod ki pehchan pakki hoti hai
    manifest {
        attributes(
            'Fabric-Loom-Version': '1.4-SNAPSHOT',
            'Main-Class': 'com.beast.BeastA1Core'
        )
    }
}
