plugins {
    id 'java'
}

group = 'com.beast'
version = '1.0.0-REAL'

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
}

dependencies {
    // Ye line code ko pack karne mein madad karegi
    compileOnly "net.fabricmc:fabric-loader:0.15.3"
}

jar {
    // Isse saari files ek saath pack ho jayengi
    from sourceSets.main.output
    from sourceSets.main.allSource
    
    manifest {
        attributes(
            'Manifest-Version': '1.0',
            'Main-Class': 'com.beast.BeastA1Core'
        )
    }
}
