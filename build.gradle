plugins {
    id 'java'
}

group = 'com.beast'
version = '1.0.0-FINAL'

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
}

dependencies {
    compileOnly "net.fabricmc:fabric-loader:0.15.3"
}

jar {
    manifest {
        attributes('Main-Class': 'com.beast.BeastA1Core')
    }
}
