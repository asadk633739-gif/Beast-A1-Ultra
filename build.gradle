plugins {
    id 'java'
}

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:0.15.3"
}

// Ye line galat paths ko ignore karke sahi file pakad legi
sourceSets {
    main {
        java { srcDirs = ['src/main/java'] }
    }
}
