plugins {
    id 'java'
}

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:0.15.3"
}

// Ye line sabse important hai size badhane ke liye
jar {
    from("src/main/java") { include "**/*.java" }
    from("src/main/resources") { include "fabric.mod.json" }
}
