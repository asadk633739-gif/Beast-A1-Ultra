plugins {
    id 'java'
}

group = 'com.beast'
version = '1.0.0-ULTRA'

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
}

dependencies {
    // Sirf basic loader jo Holy renderer ke saath fast chale
    compileOnly "net.fabricmc:fabric-loader:0.15.3"
}

jar {
    manifest {
        attributes(
            'Manifest-Version': '1.0',
            'Main-Class': 'com.beast.BeastA1Core'
        )
    }
}
